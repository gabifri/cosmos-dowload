<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="popup.css"></head>
<body>
  <h1>Cosmos Downloader</h1>
  <p id="hint">Ouvre un tableau Cosmos puis clique sur le bouton.</p>
  <button id="go">Tout télécharger</button>
  <button id="pick" class="alt">Choisir la limite à la main</button>
  <button id="finish" hidden>Arrêter et télécharger ce qui est trouvé</button>
  <button id="cancel" hidden>Annuler</button>
  <div class="bar" hidden><div id="fill"></div></div>
  <p id="status"></p>
  <script src="popup.js"></script>
</body></html>
